# Local Supabase configuration. The production project is linked separately by
# `supabase link`; credentials and generated link metadata are never committed.
project_id = "mobdeals-kenya"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["https://shop.mobdeals.co.ke"]
enable_signup = false
enable_anonymous_sign_ins = false
